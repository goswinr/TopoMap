<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TopoMap</title>
    <style>
      :root {
        --label-bg: rgb(255 255 255 / 0.88);
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #map {
        position: absolute;
        inset: 0;
      }

      /* Contour sliders: row 1 holds the readouts, row 2 the ticks and sliders.
         No background, so the panel lets map drags through except on the sliders. */
      #contour-panel {
        --thumb: 44px;
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        display: grid;
        grid-template-columns: auto repeat(2, 80px);
        grid-template-rows: auto min(70vh, 100vh - 280px);
        row-gap: 10px;
        justify-items: center;
        font: 13px/1.2 system-ui, sans-serif;
        user-select: none;
        pointer-events: none;
      }
      .contour-value {
        grid-row: 1;
        font-size: 18px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        padding: 2px 8px;
        border-radius: 6px;
        background: var(--label-bg);
      }

      /* Vertical range input; rtl puts the minimum at the bottom. */
      .contour-slider {
        grid-row: 2;
        writing-mode: vertical-lr;
        direction: rtl;
        appearance: none;
        width: var(--thumb);
        height: 100%;
        margin: 0;
        cursor: pointer;
        background: transparent;
        pointer-events: auto;
      }
      .contour-slider::-webkit-slider-runnable-track {
        background: linear-gradient(
          to right,
          transparent calc(50% - 5px),
          rgb(0 0 0 / 0.4) 0 calc(50% - 4px),
          #fff 0 calc(50% + 4px),
          rgb(0 0 0 / 0.4) 0 calc(50% + 5px),
          transparent 0
        );
      }
      .contour-slider::-moz-range-track {
        width: 8px;
        border: 1px solid rgb(0 0 0 / 0.4);
        border-radius: 5px;
        background: #fff;
      }
      .contour-slider::-webkit-slider-thumb {
        appearance: none;
        width: var(--thumb);
        height: var(--thumb);
        border: 4px solid #fff;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 1px 4px rgb(0 0 0 / 0.5);
      }
      .contour-slider::-moz-range-thumb {
        box-sizing: border-box;
        width: var(--thumb);
        height: var(--thumb);
        border: 4px solid #fff;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 1px 4px rgb(0 0 0 / 0.5);
      }
      .contour-slider:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      /* Tick labels, aligned with the thumbs' center travel. */
      #contour-ticks {
        grid-row: 2;
        grid-column: 1;
        position: relative;
        justify-self: stretch;
        min-width: 3.6em;
        color: #111;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      #contour-ticks span {
        position: absolute;
        right: 0;
        top: calc(var(--thumb) / 2 + (1 - var(--f)) * (100% - var(--thumb)));
        transform: translateY(-50%);
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--label-bg);
      }
      #contour-ticks .minor {
        color: #444;
        font-size: 12px;
        font-weight: 400;
      }
      /* Too little room for a label every 100 m: keep only the major ones. */
      @media (max-height: 900px) {
        #contour-ticks .minor {
          display: none;
        }
      }

      /* Label toggles: checkboxes drawn as switches. */
      #label-toggles {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        font: 14px/1.2 system-ui, sans-serif;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--label-bg);
        cursor: pointer;
        user-select: none;
      }
      .toggle input {
        appearance: none;
        position: relative;
        flex: none;
        width: 36px;
        height: 20px;
        margin: 0;
        border-radius: 10px;
        background: #b5b5b5;
        cursor: pointer;
        transition: background 0.15s;
      }
      .toggle input::before {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.3);
        transition: transform 0.15s;
      }
      .toggle input:checked {
        background: #222;
      }
      .toggle input:checked::before {
        transform: translateX(16px);
      }
      .toggle input:focus-visible {
        outline: 2px solid #222;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="label-toggles">
      <!-- autocomplete=off stops the browser restoring a checked state the map doesn't show -->
      <label class="toggle">
        <input type="checkbox" role="switch" id="toggle-places" autocomplete="off" />
        Cities &amp; villages
      </label>
      <label class="toggle">
        <input type="checkbox" role="switch" id="toggle-summits" autocomplete="off" />
        Summits
      </label>
      <label class="toggle">
        <input type="checkbox" role="switch" id="toggle-roads-above" autocomplete="off" checked />
        Roads above blue line
      </label>
    </div>
    <div id="contour-panel">
      <div id="contour-ticks" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

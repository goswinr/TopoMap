<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TopoMap</title>
    <style>
      :root {
        --label-bg: rgb(255 255 255 / 0.88);
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #map {
        position: absolute;
        inset: 0;
      }

      /* Contour sliders: row 1 holds the readouts, row 2 the ticks and sliders.
         No background, so the panel lets map drags through except on the sliders. */
      #contour-panel {
        --thumb: 44px;
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        display: grid;
        grid-template-columns: auto; /* the ticks; each slider adds an 80px column */
        grid-auto-columns: 80px;
        grid-template-rows: auto min(70vh, 100vh - 280px);
        row-gap: 10px;
        justify-items: center;
        font: 13px/1.2 system-ui, sans-serif;
        user-select: none;
        pointer-events: none;
      }
      #contour-panel[hidden] {
        display: none;
      }
      .contour-value {
        grid-row: 1;
        font-size: 18px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        padding: 2px 8px;
        border-radius: 6px;
        background: var(--label-bg);
      }

      /* Vertical range input; rtl puts the minimum at the bottom. */
      .contour-slider {
        grid-row: 2;
        writing-mode: vertical-lr;
        direction: rtl;
        appearance: none;
        width: var(--thumb);
        height: 100%;
        margin: 0;
        cursor: pointer;
        background: transparent;
        pointer-events: auto;
      }
      .contour-slider::-webkit-slider-runnable-track {
        background: linear-gradient(
          to right,
          transparent calc(50% - 5px),
          rgb(0 0 0 / 0.4) 0 calc(50% - 4px),
          #fff 0 calc(50% + 4px),
          rgb(0 0 0 / 0.4) 0 calc(50% + 5px),
          transparent 0
        );
      }
      .contour-slider::-moz-range-track {
        width: 8px;
        border: 1px solid rgb(0 0 0 / 0.4);
        border-radius: 5px;
        background: #fff;
      }
      .contour-slider::-webkit-slider-thumb {
        appearance: none;
        width: var(--thumb);
        height: var(--thumb);
        border: 4px solid #fff;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 1px 4px rgb(0 0 0 / 0.5);
      }
      .contour-slider::-moz-range-thumb {
        box-sizing: border-box;
        width: var(--thumb);
        height: var(--thumb);
        border: 4px solid #fff;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 1px 4px rgb(0 0 0 / 0.5);
      }
      .contour-slider:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      /* Tick labels, aligned with the thumbs' center travel. */
      #contour-ticks {
        grid-row: 2;
        grid-column: 1;
        position: relative;
        justify-self: stretch;
        min-width: 3.6em;
        color: #111;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      #contour-ticks span {
        position: absolute;
        right: 0;
        top: calc(var(--thumb) / 2 + (1 - var(--f)) * (100% - var(--thumb)));
        transform: translateY(-50%);
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--label-bg);
      }
      #contour-ticks .minor {
        color: #444;
        font-size: 12px;
        font-weight: 400;
      }
      /* Too little room for a label every 100 m: keep only the major ones. */
      @media (max-height: 900px) {
        #contour-ticks .minor {
          display: none;
        }
      }

      /* Label toggles: checkboxes drawn as switches. */
      #label-toggles {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        font: 14px/1.2 system-ui, sans-serif;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--label-bg);
        cursor: pointer;
        user-select: none;
      }
      .toggle input {
        appearance: none;
        position: relative;
        flex: none;
        width: 36px;
        height: 20px;
        margin: 0;
        border-radius: 10px;
        background: #b5b5b5;
        cursor: pointer;
        transition: background 0.15s;
      }
      .toggle input::before {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.3);
        transition: transform 0.15s;
      }
      .toggle input:checked {
        background: #222;
      }
      .toggle input:checked::before {
        transform: translateX(16px);
      }
      .toggle input:focus-visible {
        outline: 2px solid #222;
        outline-offset: 2px;
      }
      /* Off while its contour line isn't on the map. */
      .toggle:has(input:disabled) {
        color: #777;
        cursor: default;
      }
      .toggle input:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* Contour line choice: radio buttons drawn as a segmented control. */
      #contour-mode {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--label-bg);
      }
      .segments {
        display: flex;
        padding: 2px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.1);
      }
      .segments label {
        position: relative;
        min-width: 1.4em;
        padding: 2px 6px;
        border-radius: 4px;
        text-align: center;
        cursor: pointer;
        user-select: none;
      }
      .segments input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .segments label:has(:checked) {
        background: #222;
        color: #fff;
      }
      .segments label:has(:focus-visible) {
        outline: 2px solid #222;
        outline-offset: 1px;
      }
      .contour-every {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .contour-every[hidden] {
        display: none;
      }
      .contour-every input {
        width: 64px;
        box-sizing: border-box;
        font: inherit;
        font-variant-numeric: tabular-nums;
      }

      /* 3D print panel, below the switches. */
      #print-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 230px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--label-bg);
        font-size: 13px;
      }
      #print-panel[hidden] {
        display: none;
      }
      #print-panel p {
        margin: 0;
        color: #444;
      }
      .print-field {
        display: grid;
        grid-template-columns: 1fr 64px 2.2em;
        align-items: center;
        gap: 6px;
      }
      .print-field input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-variant-numeric: tabular-nums;
      }
      .print-stats {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .print-stats dt {
        color: #444;
      }
      .print-stats dd {
        margin: 0;
      }
      .print-colors ul {
        margin: 4px 0 0;
        padding: 0;
        list-style: none;
        font-variant-numeric: tabular-nums;
      }
      .print-colors li::before {
        content: '';
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      #print-panel button {
        padding: 6px 10px;
        border: 0;
        border-radius: 6px;
        background: #222;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #print-panel button:disabled {
        background: #999;
        cursor: default;
      }

      /* Print area handles: corners resize, the center one moves the area. */
      .print-handle {
        box-sizing: border-box;
        width: 18px;
        height: 18px;
        border: 3px solid #111;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.5);
        cursor: grab;
      }
      .print-handle.move {
        width: 28px;
        height: 28px;
        background:
          linear-gradient(#111 0 0) center / 12px 2px no-repeat,
          linear-gradient(#111 0 0) center / 2px 12px no-repeat,
          #fff;
        cursor: move;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="label-toggles">
      <!-- autocomplete=off stops the browser restoring a checked state the map doesn't show -->
      <label class="toggle">
        <input type="checkbox" role="switch" id="toggle-places" autocomplete="off" />
        Cities &amp; villages
      </label>
      <label class="toggle">
        <input type="checkbox" role="switch" id="toggle-summits" autocomplete="off" />
        Summits
      </label>
      <!-- Contour lines: 0-3 with their own sliders on the right, or one every N m.
           The interval is snapped to multiples of CONTOUR_STEP in main.js. -->
      <form id="contour-mode" autocomplete="off">
        <span id="contour-mode-label">Contour lines</span>
        <div class="segments" role="radiogroup" aria-labelledby="contour-mode-label">
          <label><input type="radio" name="mode" value="0" />0</label>
          <label><input type="radio" name="mode" value="1" />1</label>
          <label><input type="radio" name="mode" value="2" checked />2</label>
          <label><input type="radio" name="mode" value="3" />3</label>
          <label><input type="radio" name="mode" value="every" />every</label>
        </div>
        <label class="contour-every" hidden>
          <input name="every" type="number" min="100" max="1000" step="100" value="200" aria-label="Contour interval" />
          m
        </label>
      </form>
      <label class="toggle">
        <input type="checkbox" role="switch" id="toggle-roads-above" autocomplete="off" checked />
        Roads above blue line
      </label>
      <label class="toggle">
        <input type="checkbox" role="switch" id="toggle-print" autocomplete="off" />
        3D print
      </label>
      <!-- Filled and shown by createPrintArea while the 3D print switch is on. -->
      <form id="print-panel" autocomplete="off" hidden>
        <p class="print-hint">Drag the handles to choose the area.</p>
        <label class="print-field">
          <span>Longest side</span>
          <input name="size" type="number" min="20" max="350" step="10" value="150" />
          <span>mm</span>
        </label>
        <label class="print-field">
          <span>Height scale</span>
          <input name="exaggeration" type="number" min="0.5" max="5" step="0.25" value="1" />
          <span>×</span>
        </label>
        <label class="print-field">
          <span>Base</span>
          <input name="base" type="number" min="0.5" max="20" step="0.5" value="3" />
          <span>mm</span>
        </label>
        <!-- Height of each contour line part. At the slicer's layer height, each line
             prints as exactly one layer. Steps fit Bambu's 0.08-0.28 mm layer profiles. -->
        <label class="print-field">
          <span>Line height</span>
          <input name="line" type="number" min="0.04" max="2" step="0.04" value="0.2" />
          <span>mm</span>
        </label>
        <dl class="print-stats"></dl>
        <div class="print-colors"></div>
        <button name="download" type="button" disabled>Download STL, one colour</button>
        <button name="downloadParts" type="button" disabled>Download ZIP, coloured lines</button>
        <p>
          In Bambu Studio, import all STL files from the ZIP at once as a single object with
          multiple parts, pick a filament per part, and set the layer height to the line
          height: each line then prints as one layer.
        </p>
      </form>
    </div>
    <div id="contour-panel">
      <div id="contour-ticks" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
